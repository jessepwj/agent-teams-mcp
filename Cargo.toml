[package]
name = "agent-teams-mcp"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
authors = ["jessepwj"]
license = "MIT"
readme = "README.md"
description = "MCP server that turns Claude Code into a team lead coordinating Claude Code / Codex / Gemini worker agents, with true-push worker→lead notifications via Claude Code's FileChanged + asyncRewake hook"
repository = "https://github.com/jessepwj/agent-teams-mcp"
homepage = "https://github.com/jessepwj/agent-teams-mcp"
keywords = ["mcp", "claude-code", "agent", "team", "ai"]
categories = ["command-line-utilities", "asynchronous", "development-tools"]

[dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
futures = "0.3"
async-trait = "0.1"
cc-sdk = "0.5"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
tempfile = "3"
dirs = "6"
which = "7"
fs2 = "0.4"
tokio-stream = { version = "0.1", features = ["sync"] }
# Used to resolve our own parent-process PID (= CC client) so team ownership
# can be bound at team_create time for push-routing on multi-CC hosts.
sysinfo = { version = "0.33", default-features = false, features = ["system"] }

# CLI
clap = { version = "4", features = ["derive"], optional = true }

# Local HTTP service / web dashboard
axum = { version = "0.8" }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["cors"] }

# Optional: checkpoint (git notes-based agent session audit trail)
git2 = { version = "0.19", optional = true }
sha2 = { version = "0.10", optional = true }

# Optional: TUI dashboard (ratatui terminal UI)
ratatui = { version = "0.29", optional = true }
crossterm = { version = "0.28", optional = true }

[features]
default = []
cli = ["clap"]
dashboard = []
team-mode-web = []
checkpoint = ["git2", "sha2"]
tui = ["ratatui", "crossterm", "checkpoint"]

[lib]
name = "agent_teams"
path = "src/lib.rs"

[[bin]]
name = "agent-teams"
path = "src/bin/agent_teams.rs"
required-features = ["cli"]

[[bin]]
name = "team_mode_web"
path = "src/bin/team_mode_web.rs"
required-features = ["team-mode-web"]

[dependencies.tracing-subscriber]
version = "0.3"
features = ["env-filter"]

[dev-dependencies]
tokio-test = "0.4"
tempfile = "3"

[patch.crates-io]
cc-sdk = { path = "vendor/cc-sdk" }
crossterm = { path = "vendor/crossterm" }
ratatui = { path = "vendor/ratatui" }
tokio-test = { path = "vendor/tokio-test" }
tracing-subscriber = { path = "vendor/tracing-subscriber" }
tempfile = { path = "vendor/tempfile" }
